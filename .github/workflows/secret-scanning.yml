# HONESTY LABEL (issue #92 — see wanyrix.yml for the full label): GitHub Actions is BILLING-LOCKED on this repository; this workflow has NEVER executed on hosted runners and is validated LOCALLY ONLY (YAML parse + local step dry-runs). Keep current when editing; retire after the first hosted run.
#
# Secret scanning (issue #149 — SEC-3, wave-1 security audit): gitleaks over the
# FULL git history on every push/PR to main, plus a weekly scheduled sweep so a
# secret that lands between PRs is still caught within days, not release cycles.
#
# Config: .gitleaks.toml extends the default rule set with one documented
# allowlist (the engine's redaction positive-control fixtures — see that file).
#
# Local-validation honesty (stricter than the other workflows' label): the
# gitleaks binary is NOT installed in the current dev environment, so the
# `detect` step itself has never been executed anywhere — local validation was
# YAML parse only, and the TOML was linted as parseable. The first hosted run
# (billing unlock) is the real smoke test. No expectation of runs until then.
name: Secret scanning (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC (off-the-hour minute to avoid runner load spikes)
    - cron: "17 4 * * 1"

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not just the tree

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
